<!-- ───── Chatbot (AI assistant — Ansley, NSY architect) ───── -->
<button class="cbot-fab" id="cbot-fab" aria-label="Open chat with Ansley">
  <video class="cbot-fab-face" id="ansley-fab-video" autoplay loop muted playsinline preload="auto" poster="public/ansley-fab.png" aria-hidden="true">
    <source src="public/ansley-fab.mp4" type="video/mp4" />
    <img src="public/ansley-fab.png" alt="Ansley" />
  </video>
  <svg class="icon-close" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6L18 18M18 6L6 18"/></svg>
</button>

<div class="cbot" id="cbot" role="dialog" aria-label="Ansley — NSY AI assistant">
  <div class="cbot-head">
    <div class="cbot-avatar">
      <span class="cbot-avatar-pulse"></span>
      <video id="ansley-video" class="cbot-avatar-vid" loop muted playsinline preload="none" poster="public/ansley.png" aria-label="Ansley, NSY AI architect">
        <source src="public/ansley.mp4" type="video/mp4" />
        <img src="public/ansley.png" alt="Ansley" class="cbot-avatar-img" />
      </video>
    </div>
    <div class="cbot-head-info">
      <div class="cbot-name">Ansley <span class="cbot-ai-badge" id="cbot-ai-badge" title="Ansley, NSY's AI architect — generative assistant grounded in the site's data (RAG), model hosted in the European Union.">AI</span></div>
      <div class="cbot-status" id="cbot-status"><span class="cbot-online"></span>Online · Generative AI</div>
    </div>
    <button class="cbot-close" id="cbot-close" aria-label="Close">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6L18 18M18 6L6 18"/></svg>
    </button>
  </div>

  <div class="cbot-body" id="cbot-body">
    <div class="cbot-msg cbot-msg-assistant">
      <div class="cbot-msg-avatar"><img src="public/ansley.png" alt="Ansley" /></div>
      <div class="cbot-bubble">Hello 👋 I'm <b>Ansley</b>, NSY's AI architect: I know the whole site and answer in your language. Services, expertise, methods, availability — ask away.</div>
    </div>
  </div>

  <div class="cbot-suggestions" id="cbot-suggestions">
    <button class="cbot-chip">What services do you offer?</button>
    <button class="cbot-chip">How much does an AI website cost?</button>
    <button class="cbot-chip">Do you work with banks?</button>
    <button class="cbot-chip">How does this assistant work?</button>
  </div>

  <div class="cbot-input">
    <input type="text" id="cbot-input" placeholder="Ask your question…" maxlength="800" />
    <button class="cbot-send" id="cbot-send" aria-label="Send">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
    </button>
  </div>

  <div class="cbot-foot">
    <span id="cbot-note">AI-generated answers (Mistral, EU) · no sensitive data</span>
    <button id="cbot-escalate">Talk to Cédric →</button>
  </div>
</div>
