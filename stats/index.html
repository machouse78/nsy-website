<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>KPI — nsy.fr</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="icon" type="image/png" sizes="32x32" href="../public/cropped-NSY-logo-32x32.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Manrope:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root { --bg: #0A0F1C; --bg2: #0F1626; --line: #1C2740; --accent: #00E5FF; --warm: #F08A2C;
    --fg0: #F2F6FF; --fg1: #B8C2DC; --fg2: #8993AF; }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--bg); color: var(--fg1); font-family: Manrope, sans-serif; padding: 28px 20px 60px; }
  .wrap { max-width: 1080px; margin: 0 auto; }
  h1 { font-family: "Space Grotesk", sans-serif; color: var(--fg0); font-size: 26px; }
  h2 { font-family: "Space Grotesk", sans-serif; color: var(--fg0); font-size: 16px; margin: 34px 0 12px; }
  .mono { font-family: "JetBrains Mono", monospace; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--fg2); }
  .head { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin-bottom: 14px; }
  .timebar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; background: var(--bg2);
    border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin-bottom: 18px; }
  .timebar button { background: transparent; border: 1px solid var(--line); border-radius: 8px; color: var(--fg1);
    font: 600 12.5px Manrope, sans-serif; padding: 6px 12px; cursor: pointer; }
  .timebar button:hover { border-color: var(--accent); color: var(--fg0); }
  .timebar button.on { background: rgba(0, 229, 255, .12); border-color: var(--accent); color: var(--accent); }
  .timebar input[type=date] { background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
    color: var(--fg1); font: 500 12.5px "JetBrains Mono", monospace; padding: 5px 8px; color-scheme: dark; }
  .timebar .sep { color: var(--fg2); }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(158px, 1fr)); gap: 12px; }
  .card { background: var(--bg2); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
  .card .v { font-family: "Space Grotesk", sans-serif; font-size: 26px; font-weight: 700; color: var(--fg0); }
  .card .v small { font-size: 13px; font-weight: 500; color: var(--fg2); }
  .card .d { font-size: 12px; margin-top: 2px; }
  .up { color: #4ADE80; } .down { color: #F87171; } .flat { color: var(--fg2); }
  svg { display: block; width: 100%; height: auto; }
  .chart { background: var(--bg2); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
  table { width: 100%; border-collapse: collapse; background: var(--bg2); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; font-size: 13.5px; }
  th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--line); }
  th { color: var(--fg2); font-size: 11px; text-transform: uppercase; letter-spacing: .05em; font-weight: 600; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  tr:last-child td { border-bottom: 0; }
  a { color: var(--accent); text-decoration: none; }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 760px) { .cols { grid-template-columns: 1fr; } }
  .pill { display: inline-block; border: 1px solid var(--line); border-radius: 99px; padding: 2px 10px; font-size: 12px; margin: 2px 4px 2px 0; color: var(--fg1); }
  .pill b { color: var(--accent); font-weight: 600; }
  .note { font-size: 12px; color: var(--fg2); margin-top: 8px; }
  .resh { font-size: 11.5px; margin-top: 3px; color: var(--fg2); line-height: 1.5; }
  .resh a { color: var(--warm); }
  #err { color: #F87171; margin: 18px 0; display: none; }
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <h1>KPI nsy.fr</h1>
    <span class="mono" id="stamp">chargement…</span>
  </div>

  <div class="timebar" id="timebar">
    <span class="mono">Période</span>
    <button data-r="7">7 j</button>
    <button data-r="30" class="on">30 j</button>
    <button data-r="90">90 j</button>
    <button data-r="365">1 an</button>
    <button data-r="all">Tout</button>
    <span class="sep">·</span>
    <input type="date" id="from" /> <span class="sep">→</span> <input type="date" id="to" />
    <button id="apply">Appliquer</button>
  </div>
  <div id="err">Impossible de charger les données (data.php).</div>

  <div class="grid" id="cards"></div>
  <div class="note" id="range-note"></div>

  <h2 id="h-vis">Visiteurs</h2>
  <div class="chart"><svg id="c-vis" viewBox="0 0 1000 220" preserveAspectRatio="none"></svg></div>

  <h2 id="h-ai">Lectures par les IA (hits robots IA)</h2>
  <div class="chart"><svg id="c-ai" viewBox="0 0 1000 220" preserveAspectRatio="none"></svg></div>

  <div class="cols">
    <div>
      <h2>Robots IA — période</h2>
      <div id="ai-pills"></div>
      <h2>Top pages — période</h2>
      <table id="t-pages"><thead><tr><th>Page</th><th class="num">Vues</th></tr></thead><tbody></tbody></table>
    </div>
    <div>
      <h2>Facebook — derniers posts</h2>
      <table id="t-fb"><thead><tr><th>Post</th><th class="num">👍</th><th class="num">💬</th><th class="num">↗</th></tr></thead><tbody></tbody></table>
      <h2>Articles du journal (cumul site)</h2>
      <table id="t-journal"><thead><tr><th>Article</th><th class="num">Vues</th><th class="num">❤</th></tr></thead><tbody></tbody></table>
    </div>
  </div>
</div>

<script>
(async () => {
  let hist;
  try {
    hist = await (await fetch('data.php', { cache: 'no-store' })).json();
  } catch { document.getElementById('err').style.display = 'block'; return; }
  const allDays = Object.keys(hist.days || {}).sort();
  if (!allDays.length) { const e = document.getElementById('err'); e.textContent = 'Aucune donnée — le collecteur n\'a pas encore tourné.'; e.style.display = 'block'; return; }

  const $ = (id) => document.getElementById(id);
  const fmt = (n) => (n ?? 0).toLocaleString('fr-FR');
  const D = hist.days;
  const first = allDays[0], lastDay = allDays.at(-1);
  $('from').min = first; $('from').max = lastDay; $('to').min = first; $('to').max = lastDay;

  // ── état de la période (façon ELK : quick select OU bornes absolues) ──
  let range = { from: null, to: null, quick: '30' };
  const daysIn = (a, b) => allDays.filter((d) => d >= a && d <= b);
  const shiftISO = (iso, n) => { const t = new Date(iso + 'T12:00:00'); t.setDate(t.getDate() + n); return t.toISOString().slice(0, 10); };

  function currentWindow() {
    if (range.quick === 'all') return [first, lastDay];
    if (range.quick) return [shiftISO(lastDay, -(parseInt(range.quick, 10) - 1)), lastDay];
    return [range.from, range.to];
  }

  // ── agrégation en buckets (jour / semaine / mois selon l'étendue) ──
  function buckets(sel) {
    const span = sel.length;
    const mode = span <= 92 ? 'jour' : span <= 550 ? 'semaine' : 'mois';
    const keyOf = (d) => {
      if (mode === 'jour') return d;
      if (mode === 'mois') return d.slice(0, 7);
      const t = new Date(d + 'T12:00:00');
      const monday = new Date(t); monday.setDate(t.getDate() - ((t.getDay() + 6) % 7));
      return monday.toISOString().slice(0, 10);
    };
    const out = new Map();
    for (const d of sel) {
      const k = keyOf(d);
      const b = out.get(k) || { visiteurs: 0, ai_hits: 0, brut: false };
      b.visiteurs += D[d].visiteurs ?? 0;
      b.ai_hits += D[d].ai_hits ?? 0;
      if ((D[d].source || '') !== 'logs') b.brut = true;
      out.set(k, b);
    }
    return { mode, entries: [...out.entries()] };
  }

  function niceMax(v) {
    if (v <= 5) return 5;
    const p = Math.pow(10, Math.floor(Math.log10(v)));
    for (const m of [1, 2, 2.5, 5, 10]) if (v <= m * p) return m * p;
    return 10 * p;
  }
  function xLabel(key, mode) {
    if (mode === 'mois') { const [y, m] = key.split('-'); return `${m}/${y}`; }
    const t = new Date(key + 'T12:00:00');
    return t.toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit' });
  }
  function line(svgId, entries, field, color, mode) {
    const svg = $(svgId);
    const pts = entries.map(([, b]) => b[field]);
    const labels = entries.map(([k]) => k);
    const brut = entries.map(([, b]) => b.brut);
    const max = niceMax(Math.max(...pts, 1));
    const W = 1000, H = 250, PL = 62, PR = 16, PT = 14, PB = 34;
    const x = (i) => PL + i * (W - PL - PR) / Math.max(pts.length - 1, 1);
    const y = (v) => H - PB - v * (H - PT - PB) / max;
    const path = pts.map((v, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
    const area = `${path} L${x(pts.length - 1).toFixed(1)},${H - PB} L${x(PL === x(0) ? 0 : 0).toFixed(1)},${H - PB} Z`;
    const yTicks = [0, .25, .5, .75, 1].map((f) => Math.round(max * f));
    const step = Math.max(1, Math.ceil(pts.length / 6));
    const xIdx = [];
    for (let i = 0; i < pts.length; i += step) xIdx.push(i);
    if (xIdx.at(-1) !== pts.length - 1) xIdx.push(pts.length - 1);
    svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
    svg.innerHTML = `
      <defs><linearGradient id="g-${svgId}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="${color}" stop-opacity=".28"/><stop offset="1" stop-color="${color}" stop-opacity="0"/>
      </linearGradient></defs>
      ${yTicks.map((v) => `<line x1="${PL}" y1="${y(v).toFixed(1)}" x2="${W - PR}" y2="${y(v).toFixed(1)}" stroke="#1C2740" stroke-width="1"${v ? ' stroke-dasharray="3 5"' : ''}/>
        <text x="${PL - 8}" y="${(y(v) + 4).toFixed(1)}" fill="#8993AF" font-size="11" font-family="JetBrains Mono" text-anchor="end">${fmt(v)}</text>`).join('')}
      ${xIdx.map((i) => `<text x="${x(i).toFixed(1)}" y="${H - 10}" fill="#8993AF" font-size="11" font-family="JetBrains Mono" text-anchor="middle">${xLabel(labels[i], mode)}</text>`).join('')}
      <path d="${area}" fill="url(#g-${svgId})"/>
      <path d="${path}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round"/>
      ${pts.map((v, i) => `<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="${pts.length > 120 ? 1.6 : 3}" fill="${color}"${brut[i] ? ' fill-opacity=".45"' : ''}><title>${labels[i]} : ${fmt(v)}${brut[i] ? ' (source brute, bots inclus)' : ''}</title></circle>`).join('')}`;
  }

  const sumKey = (sel, k) => sel.reduce((a, d) => a + (D[d][k] ?? 0), 0);
  const delta = (cur, old) => {
    if (old == null || cur == null || !isFinite(old)) return '<span class="flat">—</span>';
    const d = cur - old;
    return d === 0 ? '<span class="flat">=</span>'
      : `<span class="${d > 0 ? 'up' : 'down'}">${d > 0 ? '▲' : '▼'} ${fmt(Math.abs(d))}</span>`;
  };

  function render() {
    const [a, b] = currentWindow();
    const sel = daysIn(a, b);
    if (!sel.length) return;
    $('from').value = a; $('to').value = b;
    const span = Math.round((new Date(b) - new Date(a)) / 86400000) + 1;
    const [pa, pb] = [shiftISO(a, -span), shiftISO(a, -1)];
    const prev = daysIn(pa, pb);
    const cmp = prev.length >= Math.min(sel.length, 2) ? prev : null;

    const nbBrut = sel.filter((d) => (D[d].source || '') !== 'logs').length;
    const lastSel = D[sel.at(-1)];
    const firstFb = sel.map((d) => D[d].fb?.abonnes).find((v) => v != null);
    const lastFb = [...sel].reverse().map((d) => D[d].fb?.abonnes).find((v) => v != null);

    const cards = [
      ['Visiteurs · période', fmt(sumKey(sel, 'visiteurs')), cmp ? delta(sumKey(sel, 'visiteurs'), sumKey(cmp, 'visiteurs')) : ''],
      ['Pages vues · période', fmt(sumKey(sel, 'pages_vues')), cmp ? delta(sumKey(sel, 'pages_vues'), sumKey(cmp, 'pages_vues')) : ''],
      ['Lectures IA · période', fmt(sumKey(sel, 'ai_hits')), cmp ? delta(sumKey(sel, 'ai_hits'), sumKey(cmp, 'ai_hits')) : ''],
      ['Visiteurs / jour (moy.)', fmt(Math.round(sumKey(sel, 'visiteurs') / sel.length)), ''],
      ['Abonnés Facebook', fmt(lastFb), delta(lastFb, firstFb)],
      ['Conversations Ansley', fmt(sumKey(sel, 'chat_calls')), ''],
      ['llms.txt lus', fmt(sumKey(sel, 'llms_hits')), ''],
      ['Visites venues de Facebook', fmt(sel.reduce((x, d) => x + (D[d].referrals?.facebook ?? 0), 0)), ''],
      ['Visites venues de LinkedIn', fmt(sel.reduce((x, d) => x + (D[d].referrals?.linkedin ?? 0), 0)), ''],
      ['Erreurs 404 (bruit scanners)', fmt(sel.reduce((x, d) => x + (D[d].status?.['404'] ?? 0), 0)), ''],
      ['Hits de scanners identifiés', fmt(sumKey(sel, 'scan_hits')), ''],
      ['Moteurs (SE)', fmt(sumKey(sel, 'se_hits')), ''],
    ];
    $('cards').innerHTML = cards.map(([t, v, d]) =>
      `<div class="card"><div class="mono">${t}</div><div class="v">${v}</div><div class="d">${d}</div></div>`).join('');

    const bk = buckets(sel);
    $('h-vis').textContent = `Visiteurs — par ${bk.mode}`;
    $('h-ai').textContent = `Lectures par les IA — par ${bk.mode}`;
    line('c-vis', bk.entries, 'visiteurs', '#00E5FF', bk.mode);
    line('c-ai', bk.entries, 'ai_hits', '#F08A2C', bk.mode);

    const dFmt = (iso) => new Date(iso + 'T12:00:00').toLocaleDateString('fr-FR', { day: 'numeric', month: 'short', year: 'numeric' });
    const nbBrutCmp = cmp ? cmp.filter((d) => (D[d].source || '') !== 'logs').length : 0;
    $('range-note').textContent = `${dFmt(a)} → ${dFmt(b)} · ${sel.length} jours de données` +
      (cmp ? ` · comparé à ${dFmt(pa)} → ${dFmt(pb)}` : '') +
      (nbBrut ? ` · ⚠ ${nbBrut} jour(s) en source brute AWStats (bots inclus)` : '') +
      (nbBrutCmp ? ` · ⚠ comparaison partiellement en source brute — deltas à relativiser` : '');

    const ai = {};
    for (const d of sel) for (const [n, h] of Object.entries(D[d].ai || {})) ai[n] = (ai[n] || 0) + h;
    $('ai-pills').innerHTML = Object.entries(ai).sort((x, y) => y[1] - x[1])
      .map(([n, h]) => `<span class="pill">${n} <b>${fmt(h)}</b></span>`).join('') || '<span class="mono">aucun</span>';

    const pages = {};
    for (const d of sel) for (const [p, v] of Object.entries(D[d].top_pages || {})) pages[p] = (pages[p] || 0) + v;
    document.querySelector('#t-pages tbody').innerHTML = Object.entries(pages).sort((x, y) => y[1] - x[1]).slice(0, 12)
      .map(([p, v]) => `<tr><td><a href="https://www.nsy.fr${p}" target="_blank" rel="noopener">${p}</a></td><td class="num">${fmt(v)}</td></tr>`).join('')
      || '<tr><td colspan="2" class="mono">—</td></tr>';

    document.querySelector('#t-fb tbody').innerHTML = (lastSel.fb?.posts || [])
      .map((p) => {
        const resh = (p.reshares || []).length
          ? `<div class="resh">↗ visibles : ${p.reshares.map((r) => r.url
              ? `<a href="${r.url}" target="_blank" rel="noopener">${r.nom}</a>` : r.nom).join(' · ')}</div>`
          : (p.shares ? '<div class="resh">↗ repartages privés/groupes (non exposés par Meta)</div>' : '');
        return `<tr><td><a href="${p.url}" target="_blank" rel="noopener">${p.date}</a>${resh}</td><td class="num">${fmt(p.likes)}</td><td class="num">${fmt(p.comments)}</td><td class="num">${fmt(p.shares)}</td></tr>`;
      }).join('')
      || '<tr><td colspan="4" class="mono">pas de données Facebook sur le dernier jour de la période</td></tr>';

    document.querySelector('#t-journal tbody').innerHTML = Object.entries(lastSel.journal || {})
      .map(([s, v]) => `<tr><td><a href="https://www.nsy.fr/${s}" target="_blank" rel="noopener">${s.replace('.html', '')}</a></td><td class="num">${fmt(v.vues)}</td><td class="num">${fmt(v.likes)}</td></tr>`).join('')
      || '<tr><td colspan="3" class="mono">—</td></tr>';

    document.querySelectorAll('#timebar button[data-r]').forEach((btn) =>
      btn.classList.toggle('on', btn.dataset.r === range.quick));
  }

  document.querySelectorAll('#timebar button[data-r]').forEach((btn) =>
    btn.addEventListener('click', () => { range = { quick: btn.dataset.r, from: null, to: null }; render(); }));
  $('apply').addEventListener('click', () => {
    const f = $('from').value, t = $('to').value;
    if (f && t && f <= t) { range = { quick: null, from: f, to: t }; render(); }
  });

  $('stamp').textContent = `historique : ${dLabel(first)} → ${dLabel(lastDay)} · ${allDays.length} jours`;
  function dLabel(iso) { return new Date(iso + 'T12:00:00').toLocaleDateString('fr-FR', { day: 'numeric', month: 'short', year: 'numeric' }); }
  render();
})();
</script>
</body>
</html>
